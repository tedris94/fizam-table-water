# Netlify configuration for Fizam Next.js + Payload CMS + SQLite
# https://docs.netlify.com/configure-builds/file-conventions/

[build]
  # Build command for Next.js standalone
  command = "pnpm run build"
  # Directory to publish (Next.js standalone output)
  publish = ".next"

# Environment variables (set these in Netlify UI for secrets, or here for public values)
[build.environment]
  NODE_VERSION = "24.15.0"
  PNPM_VERSION = "9.15.4"
  # PUBLIC URLs (set secrets in Netlify UI dashboard)
  NEXT_PUBLIC_SITE_URL = "https://fizam.ng"

# Redirect all non-matching routes to Next.js (SPA-like behavior for frontend)
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

# Caching headers for Next.js static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent direct access to sensitive files
[[headers]]
  for = "/data/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.env*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/node_modules/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
