yaml
on:
  push:
    branches:
      - dev
name: 🚀 Deploy website on push

jobs:
  web-deploy:
    name: 🔮 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install NPM packages
        run: npm install

      - name: Build project
        run: npm run build

      - name: 📁 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ://bughunter.com.ng
          username: ${{ secrets.ftp_username_new }}
          password: ${{ secrets.ftp_password_new }}
          local-dir: ./dist/